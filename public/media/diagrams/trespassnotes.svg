<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1500"
  height="1640"
  viewBox="0 0 1500 1640"
  role="img"
  aria-labelledby="diagram-title diagram-description"
>
  <title id="diagram-title">
    Trespass to the Person: Northern Ireland and UK
  </title>

  <desc id="diagram-description">
    A legal study flow chart comparing assault, battery and false
    imprisonment. Each route identifies the essential requirements and
    memorable cases before joining a shared examination of consent,
    lawful authority, protective force and necessity. A separate panel
    explains intentional infliction of physical or psychiatric harm.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>

    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #172033;
      }

      .title {
        font-size: 34px;
        font-weight: 700;
      }

      .subtitle {
        font-size: 20px;
      }

      .heading {
        font-size: 23px;
        font-weight: 700;
      }

      .body {
        font-size: 19px;
      }

      .small {
        font-size: 17px;
      }

      .label {
        font-size: 17px;
        font-weight: 700;
      }

      .connector {
        fill: none;
        stroke: #475569;
        stroke-width: 2.5;
        stroke-linejoin: round;
        marker-end: url(#arrow);
      }

      .rule {
        fill: #eff6ff;
        stroke: #2563eb;
        stroke-width: 2;
      }

      .case {
        fill: #faf5ff;
        stroke: #9333ea;
        stroke-width: 2;
      }

      .defence {
        fill: #f0fdf4;
        stroke: #15803d;
        stroke-width: 2;
      }

      .outcome {
        fill: #fff7ed;
        stroke: #c2410c;
        stroke-width: 2;
      }

      .jurisdiction {
        fill: #fff1f2;
        stroke: #be123c;
        stroke-width: 2;
      }
    </style>
  </defs>

  <!-- Solid background for light and dark website themes. -->
  <rect width="1500" height="1640" fill="#ffffff"/>

  <!-- Title. -->
  <text x="750" y="55" text-anchor="middle" class="title">
    TRESPASS TO THE PERSON
  </text>

  <text x="750" y="91" text-anchor="middle" class="subtitle">
    Northern Ireland / UK · Identify each possible tort separately
  </text>

  <!-- Starting point. -->
  <rect
    x="420" y="120" width="660" height="95" rx="14"
    class="rule"
  />

  <text x="750" y="155" text-anchor="middle" class="heading">
    START: What interference occurred?
  </text>

  <text x="750" y="187" text-anchor="middle" class="body">
    One incident may support more than one claim.
  </text>

  <!-- Branch connectors. -->
  <path d="M 750 215 V 240 H 270 V 270" class="connector"/>
  <path d="M 750 215 V 270" class="connector"/>
  <path d="M 750 215 V 240 H 1230 V 270" class="connector"/>

  <!-- Assault route. -->
  <rect
    x="50" y="270" width="440" height="210" rx="14"
    class="rule"
  />

  <text x="72" y="307" class="heading">ASSAULT</text>

  <text x="72" y="344" class="body">
    <tspan x="72" dy="0">Did the defendant intentionally cause</tspan>
    <tspan x="72" dy="28">reasonable apprehension of an</tspan>
    <tspan x="72" dy="28">immediate unlawful physical contact?</tspan>
    <tspan x="72" dy="35">Physical contact is not required.</tspan>
  </text>

  <!-- Battery route. -->
  <rect
    x="530" y="270" width="440" height="210" rx="14"
    class="rule"
  />

  <text x="552" y="307" class="heading">BATTERY</text>

  <text x="552" y="344" class="body">
    <tspan x="552" dy="0">Was there intentional, direct physical</tspan>
    <tspan x="552" dy="28">contact without valid consent</tspan>
    <tspan x="552" dy="28">or another lawful justification?</tspan>
    <tspan x="552" dy="35">An intention to injure is unnecessary.</tspan>
  </text>

  <!-- False imprisonment route. -->
  <rect
    x="1010" y="270" width="440" height="210" rx="14"
    class="rule"
  />

  <text x="1032" y="307" class="heading">FALSE IMPRISONMENT</text>

  <text x="1032" y="344" class="body">
    <tspan x="1032" dy="0">Was there intentional, total restraint</tspan>
    <tspan x="1032" dy="28">of the claimant’s freedom of movement</tspan>
    <tspan x="1032" dy="28">without lawful justification?</tspan>
    <tspan x="1032" dy="35">A prison or locked room is unnecessary.</tspan>
  </text>

  <path d="M 270 480 V 510" class="connector"/>
  <path d="M 750 480 V 510" class="connector"/>
  <path d="M 1230 480 V 510" class="connector"/>

  <!-- Assault checks and cases. -->
  <rect
    x="50" y="510" width="440" height="250" rx="14"
    class="case"
  />

  <text x="72" y="546" class="heading">CHECKS AND CASE ANCHORS</text>

  <text x="72" y="582" class="body">
    <tspan x="72" dy="0">Assess words, silence and context.</tspan>
    <tspan x="72" dy="28">Tuberville v Savage:</tspan>
    <tspan x="72" dy="25">words may negate an apparent threat.</tspan>
    <tspan x="72" dy="32">R v Ireland:</tspan>
    <tspan x="72" dy="25">silence may convey a threat.</tspan>
    <tspan x="72" dy="32">Thomas v National Union of Mineworkers:</tspan>
    <tspan x="72" dy="25">practical barriers affect immediacy.</tspan>
  </text>

  <!-- Battery checks and cases. -->
  <rect
    x="530" y="510" width="440" height="250" rx="14"
    class="case"
  />

  <text x="552" y="546" class="heading">CHECKS AND CASE ANCHORS</text>

  <text x="552" y="582" class="body">
    <tspan x="552" dy="0">Ordinary social contact is not</tspan>
    <tspan x="552" dy="25">automatically a battery.</tspan>
    <tspan x="552" dy="32">Collins v Wilcock:</tspan>
    <tspan x="552" dy="25">physical restraint needs justification.</tspan>
    <tspan x="552" dy="32">Letang v Cooper:</tspan>
    <tspan x="552" dy="25">accidental injury ordinarily belongs</tspan>
    <tspan x="552" dy="25">in negligence, not battery.</tspan>
  </text>

  <!-- False imprisonment checks and cases. -->
  <rect
    x="1010" y="510" width="440" height="250" rx="14"
    class="case"
  />

  <text x="1032" y="546" class="heading">CHECKS AND CASE ANCHORS</text>

  <text x="1032" y="582" class="body">
    <tspan x="1032" dy="0">Bird v Jones:</tspan>
    <tspan x="1032" dy="25">obstruction is not total restraint.</tspan>
    <tspan x="1032" dy="32">Check any reasonable escape route.</tspan>
    <tspan x="1032" dy="28">Awareness of detention is unnecessary.</tspan>
    <tspan x="1032" dy="32">Iqbal v Prison Officers Association:</tspan>
    <tspan x="1032" dy="25">examine intention, omissions and</tspan>
    <tspan x="1032" dy="25">any relevant duty to release.</tspan>
  </text>

  <!-- Routes merge. -->
  <path d="M 270 760 V 790 H 750 V 830" class="connector"/>
  <path d="M 750 760 V 830" class="connector"/>
  <path d="M 1230 760 V 790 H 750" class="connector"/>

  <rect x="452" y="797" width="596" height="25" fill="#ffffff"/>

  <text x="750" y="815" text-anchor="middle" class="small">
    If the relevant elements are established, test justification.
  </text>

  <!-- Shared defences. -->
  <rect
    x="150" y="830" width="1200" height="215" rx="14"
    class="defence"
  />

  <text x="175" y="869" class="heading">
    IS THERE A VALID DEFENCE OR LAWFUL JUSTIFICATION?
  </text>

  <text x="175" y="908" class="body">
    <tspan x="175" dy="0">Consent: valid, freely given, within scope and not withdrawn? Assess capacity.</tspan>
    <tspan x="175" dy="30">Lawful authority: does a legal power apply, and have its conditions been satisfied?</tspan>
    <tspan x="175" dy="30">Protective force: was the force necessary and reasonable to protect a person or property?</tspan>
    <tspan x="175" dy="30">Necessity: was urgent intervention justified? Consider capacity, alternatives and refusal.</tspan>
  </text>

  <!-- Outcomes. -->
  <path d="M 430 1045 V 1100" class="connector"/>
  <path d="M 1070 1045 V 1100" class="connector"/>

  <text x="450" y="1078" class="label">YES</text>
  <text x="1090" y="1078" class="label">NO</text>

  <rect
    x="150" y="1100" width="570" height="115" rx="14"
    class="defence"
  />

  <text x="172" y="1137" class="heading">JUSTIFIED INTERFERENCE</text>

  <text x="172" y="1171" class="body">
    <tspan x="172" dy="0">No liability to the extent that the act is justified.</tspan>
    <tspan x="172" dy="27">Excess force or acts beyond permission may remain unlawful.</tspan>
  </text>

  <rect
    x="750" y="1100" width="600" height="115" rx="14"
    class="outcome"
  />

  <text x="772" y="1137" class="heading">LIABILITY IF ALL ELEMENTS ARE PROVED</text>

  <text x="772" y="1171" class="body">
    <tspan x="772" dy="0">These three torts require no proof of actual damage.</tspan>
    <tspan x="772" dy="27">Assess compensation separately: remember Lumba.</tspan>
  </text>

  <!-- Related but separate tort. -->
  <rect
    x="50" y="1250" width="1400" height="145" rx="14"
    class="outcome"
  />

  <text x="75" y="1288" class="heading">
    SEPARATE ROUTE: INTENTIONAL INFLICTION OF PHYSICAL OR PSYCHIATRIC HARM
  </text>

  <text x="75" y="1324" class="body">
    <tspan x="75" dy="0">Wilkinson v Downton, explained in Rhodes v OPO: unjustified conduct directed towards the claimant</tspan>
    <tspan x="75" dy="27">+ intention to cause physical harm or severe mental or emotional distress</tspan>
    <tspan x="75" dy="27">+ resulting physical harm or recognised psychiatric illness. Recklessness alone is insufficient.</tspan>
  </text>

  <!-- Northern Ireland jurisdiction reminder. -->
  <rect
    x="50" y="1420" width="1400" height="105" rx="14"
    class="jurisdiction"
  />

  <text x="75" y="1455" class="heading">NORTHERN IRELAND: CHECK THE APPLICABLE FRAMEWORK</text>

  <text x="75" y="1487" class="body">
    <tspan x="75" dy="0">Check current NI capacity legislation and commencement provisions; do not automatically import the English framework.</tspan>
    <tspan x="75" dy="26">Physical punishment: Article 2, Law Reform (Miscellaneous Provisions) (Northern Ireland) Order 2006 restricts the defence.</tspan>
  </text>

  <!-- Legend. -->
  <rect x="65" y="1553" width="20" height="20" rx="3" class="rule"/>
  <text x="96" y="1569" class="small">Rules</text>

  <rect x="230" y="1553" width="20" height="20" rx="3" class="case"/>
  <text x="261" y="1569" class="small">Cases</text>

  <rect x="395" y="1553" width="20" height="20" rx="3" class="defence"/>
  <text x="426" y="1569" class="small">Defences</text>

  <rect x="600" y="1553" width="20" height="20" rx="3" class="outcome"/>
  <text x="631" y="1569" class="small">Outcomes / separate tort</text>

  <rect x="970" y="1553" width="20" height="20" rx="3" class="jurisdiction"/>
  <text x="1001" y="1569" class="small">NI legislation / jurisdiction</text>

  <!-- Footer. -->
  <text x="750" y="1610" text-anchor="middle" class="small">
    Introductory study aid · Read alongside the accompanying notes and primary authorities · Not an exhaustive statement of the law
  </text>
</svg>