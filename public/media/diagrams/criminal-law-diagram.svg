<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img" aria-labelledby="title desc"><title id="title">Criminal Law: Foundations and Limits</title><desc id="desc">Study diagram on the purposes of criminal law, criminal liability, Article 7 ECHR and overcriminalisation. Focus: England and Wales and Northern Ireland.</desc><rect width="1500" height="1250" fill="#f3f6fa"/><g font-family="Arial, Helvetica, sans-serif">
<text x="60" y="65" font-size="38" fill="#0f172a" font-weight="700">CRIMINAL LAW</text>
<text x="60" y="105" font-size="25" fill="#334155" font-weight="400">Foundations, liability and limits on punishment</text>
<text x="60" y="142" font-size="19" fill="#64748b" font-weight="400">England &amp; Wales and Northern Ireland | Introductory study diagram</text>
<rect x="60" y="174" width="1380" height="100" rx="18" fill="#142d4e"/>
<text x="88" y="212" font-size="20" fill="#93c5fd" font-weight="700">WHAT IS A CRIME?</text>
<text x="88" y="247" font-size="24" fill="white" font-weight="400">Conduct constituting an offence and attracting a legally authorised criminal sanction.</text>
<rect x="60" y="310" width="440" height="85" rx="14" fill="#0f766e"/>
<text x="82" y="346" font-size="24" fill="white" font-weight="700">1  PURPOSES</text>
<text x="82" y="376" font-size="19" fill="white" font-weight="400">Why criminal law intervenes</text>
<rect x="530" y="310" width="440" height="85" rx="14" fill="#2563eb"/>
<text x="552" y="346" font-size="24" fill="white" font-weight="700">2  LIABILITY</text>
<text x="552" y="376" font-size="19" fill="white" font-weight="400">What must be established</text>
<rect x="1000" y="310" width="440" height="85" rx="14" fill="#7c3aed"/>
<text x="1022" y="346" font-size="24" fill="white" font-weight="700">3  LEGALITY</text>
<text x="1022" y="376" font-size="19" fill="white" font-weight="400">When the state may punish</text>
<rect x="60" y="415" width="440" height="230" rx="16" fill="white" stroke="#dbe3ee"/><rect x="60" y="415" width="440" height="7" rx="3" fill="#0f766e"/>
<text x="82" y="458" font-size="23" fill="#0f172a" font-weight="700">Protection and public order</text>
<text x="82" y="497" font-size="20" fill="#334155" font-weight="400">Protect people and public interests.</text>
<text x="82" y="526" font-size="20" fill="#334155" font-weight="400">Maintain order and security.</text>
<text x="82" y="555" font-size="20" fill="#334155" font-weight="400">Express condemnation of wrongdoing.</text>
<text x="82" y="584" font-size="20" fill="#334155" font-weight="400">Reduce offending and support repair.</text>
<rect x="60" y="665" width="440" height="290" rx="16" fill="white" stroke="#dbe3ee"/><rect x="60" y="665" width="440" height="7" rx="3" fill="#0f766e"/>
<text x="82" y="708" font-size="23" fill="#0f172a" font-weight="700">Sentencing objectives</text>
<text x="82" y="747" font-size="20" fill="#334155" font-weight="400">Punishment</text>
<text x="82" y="776" font-size="20" fill="#334155" font-weight="400">Reduction of crime, including deterrence</text>
<text x="82" y="805" font-size="20" fill="#334155" font-weight="400">Reform and rehabilitation</text>
<text x="82" y="834" font-size="20" fill="#334155" font-weight="400">Protection of the public</text>
<text x="82" y="863" font-size="20" fill="#334155" font-weight="400">Reparation to those affected</text>
<text x="82" y="927" font-size="17" fill="#64748b" font-weight="400">E&amp;W: Sentencing Act 2020, section 57.</text>
<rect x="530" y="415" width="440" height="230" rx="16" fill="white" stroke="#dbe3ee"/><rect x="530" y="415" width="440" height="7" rx="3" fill="#2563eb"/>
<text x="552" y="458" font-size="23" fill="#0f172a" font-weight="700">Actus reus and mens rea</text>
<text x="552" y="497" font-size="20" fill="#334155" font-weight="400">Actus reus: external offence elements.</text>
<text x="552" y="526" font-size="20" fill="#334155" font-weight="400">Conduct; qualifying omissions;</text>
<text x="552" y="555" font-size="20" fill="#334155" font-weight="400">circumstances; results and causation.</text>
<text x="552" y="584" font-size="20" fill="#334155" font-weight="400">Mens rea: the required mental element.</text>
<text x="552" y="613" font-size="20" fill="#334155" font-weight="400">It is not limited to intention.</text>
<rect x="530" y="665" width="440" height="290" rx="16" fill="white" stroke="#dbe3ee"/><rect x="530" y="665" width="440" height="7" rx="3" fill="#2563eb"/>
<text x="552" y="708" font-size="23" fill="#0f172a" font-weight="700">Check the particular offence</text>
<text x="552" y="747" font-size="20" fill="#334155" font-weight="400">Do the required elements coincide?</text>
<text x="552" y="776" font-size="20" fill="#334155" font-weight="400">Does strict liability apply to an element?</text>
<text x="552" y="805" font-size="20" fill="#334155" font-weight="400">Is a defence available?</text>
<text x="552" y="834" font-size="20" fill="#334155" font-weight="400">Completed or inchoate offence?</text>
<text x="552" y="863" font-size="20" fill="#334155" font-weight="400">Attempt and conspiracy have their</text>
<text x="552" y="892" font-size="20" fill="#334155" font-weight="400">own requirements. Intention alone</text>
<text x="552" y="921" font-size="20" fill="#334155" font-weight="400">is not enough for an attempt.</text>
<rect x="1000" y="415" width="440" height="230" rx="16" fill="white" stroke="#dbe3ee"/><rect x="1000" y="415" width="440" height="7" rx="3" fill="#7c3aed"/>
<text x="1022" y="458" font-size="23" fill="#0f172a" font-weight="700">Article 7 ECHR</text>
<text x="1022" y="497" font-size="20" fill="#334155" font-weight="400">No retrospective criminalisation.</text>
<text x="1022" y="526" font-size="20" fill="#334155" font-weight="400">No heavier retrospective penalty.</text>
<text x="1022" y="555" font-size="20" fill="#334155" font-weight="400">Law must be accessible and</text>
<text x="1022" y="584" font-size="20" fill="#334155" font-weight="400">reasonably foreseeable.</text>
<text x="1022" y="613" font-size="20" fill="#334155" font-weight="400">No adverse extension by analogy.</text>
<rect x="1000" y="665" width="440" height="290" rx="16" fill="white" stroke="#dbe3ee"/><rect x="1000" y="665" width="440" height="7" rx="3" fill="#7c3aed"/>
<text x="1022" y="708" font-size="23" fill="#0f172a" font-weight="700">Judicial development has limits</text>
<text x="1022" y="747" font-size="20" fill="#334155" font-weight="400">Foreseeable clarification is permitted</text>
<text x="1022" y="776" font-size="20" fill="#334155" font-weight="400">if consistent with the offence’s essence.</text>
<text x="1022" y="805" font-size="20" fill="#334155" font-weight="400">S.W. v United Kingdom (1995).</text>
<text x="1022" y="834" font-size="20" fill="#334155" font-weight="400">Article 7(2) is not a general licence</text>
<text x="1022" y="863" font-size="20" fill="#334155" font-weight="400">to punish retrospectively merely</text>
<text x="1022" y="892" font-size="20" fill="#334155" font-weight="400">because conduct seems immoral.</text>
<rect x="60" y="985" width="1380" height="150" rx="18" fill="#fff8e9" stroke="#e7cf98"/>
<text x="85" y="1024" font-size="23" fill="#854d0e" font-weight="700">POLICY CHECK: IS CRIMINALISATION JUSTIFIED?</text>
<text x="85" y="1059" font-size="20" fill="#334155" font-weight="400">Overcriminalisation concerns unnecessary or excessive use of criminal offences and sanctions.</text>
<text x="85" y="1088" font-size="20" fill="#334155" font-weight="400">Ask: Is the law clear? Is punishment proportionate? Could a less punitive response work?</text>
<text x="85" y="1117" font-size="20" fill="#334155" font-weight="400">Distinguish legal validity from the policy question of whether criminalisation is justified.</text>
<text x="60" y="1177" font-size="18" fill="#0f172a" font-weight="700">ANALYTICAL ROUTE</text>
<text x="60" y="1208" font-size="21" fill="#334155" font-weight="400">Jurisdiction → offence and source → external elements → fault → defences → legality</text>
<text x="60" y="1235" font-size="16" fill="#64748b" font-weight="400">Study overview, not a complete liability test. Always check the offence and jurisdiction-specific legislation.</text>
</g></svg>